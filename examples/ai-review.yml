# Copy to .github/workflows/ai-review.yml in the repo you want reviewed, and add a
# CURSOR_API_KEY repository secret (Settings -> Secrets and variables -> Actions).
#
# Fork PRs: with `pull_request`, PRs from forks get no secrets and a read-only token, so they
# are not reviewed. To review them, change the trigger to `pull_request_target`. That is safe
# with this action because it never checks out or runs PR code: it reads the diff through the
# API and loads .github/ai-review.yml from the base commit. Do not add a checkout step of the
# PR head to this workflow if you switch.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: gurusanjay2322/code-review-agent@v1
        with:
          cursor-api-key: ${{ secrets.CURSOR_API_KEY }}
          # model: composer-2.5
          # min-severity: medium
          # fail-on: critical
